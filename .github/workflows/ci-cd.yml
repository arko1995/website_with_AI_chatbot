name: CI CD

on:
  push:
    branches:
      - main
      - setup/production-admin
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build client
        env:
          VITE_BASE_PATH: /preview/
        run: npm run build --prefix client

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Check server syntax
        run: node --check server/src/index.js && node --check server/src/auth.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install agent dependencies
        run: pip install -r agent/requirements.txt

      - name: Check Python syntax
        run: python -m py_compile agent/main.py

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          build-args: |
            VITE_BASE_PATH=/preview/
          tags: |
            ghcr.io/arko1995/skylinedb3-web:latest
            ghcr.io/arko1995/skylinedb3-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/arko1995/skylinedb3-agent:latest
            ghcr.io/arko1995/skylinedb3-agent:${{ github.sha }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Copy production Compose file
        run: |
          scp compose.prod.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/apps/website_with_AI_chatbot/compose.prod.yml

      - name: Pull and restart production containers
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
            set -e
            cd ~/apps/website_with_AI_chatbot
            echo '${{ secrets.GHCR_PULL_TOKEN }}' | docker login ghcr.io -u '${{ github.repository_owner }}' --password-stdin
            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d --remove-orphans
            docker compose -f compose.prod.yml ps
            curl --fail --retry 12 --retry-delay 5 http://127.0.0.1:5000/api/health
            docker image prune -f
          EOF
