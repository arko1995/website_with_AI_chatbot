services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  agent:
    image: ghcr.io/arko1995/skylinedb3-agent:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/arko1995/skylinedb3-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "true"
      HOST: 0.0.0.0
      PORT: 5000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      MONGODB_URI: mongodb://mongo:27017/skylinedb3
      PYTHON_AGENT_URL: http://agent:8000/chat
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
